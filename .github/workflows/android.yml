name: App Android

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Dipendenze
        working-directory: app
        run: npm ci
      - name: Notifiche (se c'è google-services.json)
        working-directory: app
        run: |
          if [ -s android/app/google-services.json ]; then
            node -e "const f='capacitor.config.json';const c=require('./'+f);c.android.appendUserAgent='ESP32LabApp/1 fcm';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
            echo "Notifiche attive"
          fi
      - name: Sincronizza Capacitor
        working-directory: app
        run: npx cap sync android
      - name: Compila APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log; then
            # gli errori diventano annotazioni (leggibili anche senza accesso ai log)
            grep -E "error:|FAILURE|What went wrong|> |e: |Exception" build.log | grep -v "^> Task" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../../ESP32-Lab.apk
      - name: Pubblica (Release «app-latest»)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest ESP32-Lab.apk --title "App Android ESP32 Lab (build ${{ github.run_number }})" \
            --notes "Scarica ESP32-Lab.apk sul telefono Android e aprilo per installarlo. Build ${{ github.run_number }}." --latest
